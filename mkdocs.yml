site_name: RAG-MTST
site_description: Developer-oriented document indexing, retrieval and grounded answers
docs_dir: docs
site_dir: site
not_in_nav: |
  /assets/sample.md
  /assets/experiments/*.md
use_directory_urls: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search:
      lang: en
extra_css:
  - assets/stylesheets/diagrams.css
nav:
  - Home: index.md
  - Tutorials:
      - Quickstart: tutorials/quickstart.md
      - Experiments: tutorials/experiments.md
  - How-to Guides:
      - Ingest and manage sources: how-to/ingest.md
      - Search and ask: how-to/search.md
      - Use conversations: how-to/conversations.md
      - Choose model providers: how-to/providers.md
      - Develop and test: how-to/develop.md
      - Deploy: how-to/deploy.md
      - Troubleshoot: how-to/troubleshoot.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/http.md
      - Python API: reference/python.md
      - Configuration: reference/configuration.md
      - Formats, limits and scope: reference/limits.md
  - Explanation:
      - How it works: explanation/overview.md
      - Architecture and transactions: explanation/architecture.md
      - Extraction and indexing: explanation/indexing.md
      - Retrieval and answers: explanation/retrieval.md
      - Security and data lifecycle: explanation/security.md
