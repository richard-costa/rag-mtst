site_name: RAG-MTST
site_description: Developer-oriented document indexing, retrieval and grounded answers
docs_dir: docs
site_dir: site
not_in_nav: |
  /assets/sample.md
  /assets/experiments/*.md
use_directory_urls: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search:
      lang: en
extra_css:
  - assets/stylesheets/diagrams.css
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How It Works: how-it-works.md
  - Experiments: experiments.md
  - Development: development.md
  - Operations: operations.md
  - Practical Guides:
      - Ingest and Reindex: how-to/ingest.md
      - Model Providers: how-to/providers.md
      - Conversations: how-to/conversations.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/http.md
      - Python API: reference/python.md
      - Configuration: reference/configuration.md
      - Formats and Limits: reference/limits.md
  - Implementation Deep Dives:
      - Architecture and Transactions: explanation/architecture.md
      - Extraction and Indexing: explanation/indexing.md
      - Retrieval and Answers: explanation/retrieval.md
